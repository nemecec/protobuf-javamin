syntax = "proto2";

package dev.nemecec.protobuf.javamin.integration;

option java_package = "dev.nemecec.protobuf.javamin.integration.gen";
option java_multiple_files = true;

// Covers every field type, cardinality, nested message, and enum interaction we
// care about for the first end-to-end test.
message Sample {
  optional int32 id = 1;
  required string name = 2;
  optional int64 createdAtMillis = 3;
  optional bool active = 4;
  optional double weight = 5;
  optional bytes payload = 6;

  optional Color favoriteColor = 7;

  optional Inner inner = 8;
  repeated Inner items = 9;

  repeated string tags = 10;
  repeated Color colorPalette = 11;

  message Inner {
    optional int32 value = 1;
    optional string label = 2;
  }
}

enum Color {
  RED = 0;
  GREEN = 1;
  BLUE = 2;
}
