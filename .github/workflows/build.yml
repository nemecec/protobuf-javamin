name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 24

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # `build` runs `assemble` + `check` (which includes `test`) across all
      # subprojects. `:integration-tests:generateTestProto` depends on
      # `:codegen:publishToMavenLocal`, so the codegen uber-jar is published
      # locally and then resolved back via Maven coordinates exactly the way
      # downstream consumers will use it.
      - name: Build and test
        run: ./gradlew build

      - name: Upload runtime jar
        uses: actions/upload-artifact@v6
        with:
          name: runtime
          path: runtime/build/libs/*.jar
          retention-days: 7

      - name: Upload codegen jar
        uses: actions/upload-artifact@v6
        with:
          name: codegen
          path: codegen/build/libs/*.jar
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            runtime/build/reports/tests/
            integration-tests/build/reports/tests/
          retention-days: 7
