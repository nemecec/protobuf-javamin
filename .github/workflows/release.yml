name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 24

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Update version in build.gradle.kts
        run: |
          sed -i 's/version = "[^"]*"/version = "${{ inputs.version }}"/' build.gradle.kts
          echo "Updated to ${{ inputs.version }}:"
          grep 'version = ' build.gradle.kts

      - name: Update version in markdown
        run: |
          # Maven-coordinate references in the simple example, like
          #   dev.nemecec.protobuf.javamin:protobuf-javamin-{runtime,codegen}:VERSION
          find . -name "*.md" -not -path "./build/*" -not -path "*/build/*" -exec sed -i -E \
            's|(dev\.nemecec\.protobuf\.javamin:[a-zA-Z_-]+):[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?|\1:${{ inputs.version }}|g' {} \;
          # Version-catalog snippet in the recommended example:
          #   protobuf-javamin = "VERSION"
          find . -name "*.md" -not -path "./build/*" -not -path "*/build/*" -exec sed -i -E \
            's|(protobuf-javamin = ")[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?|\1${{ inputs.version }}|g' {} \;

      - name: Run full build (validates everything compiles + tests pass)
        run: ./gradlew clean build

      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Commit version bump
        run: |
          git add build.gradle.kts
          git add "*.md" || true
          git add "**/*.md" || true
          git commit -m "Release ${{ inputs.version }}"

      - name: Tag and push
        run: |
          git tag "v${{ inputs.version }}"
          git push origin HEAD
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            runtime/build/libs/*.jar \
            codegen/build/libs/*.jar

      - name: Set next development version
        run: |
          VERSION="${{ inputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          MICRO=$(echo "$VERSION" | cut -d. -f3)
          NEXT="${MAJOR}.${MINOR}.$((MICRO + 1))-SNAPSHOT"
          echo "Next development version: $NEXT"
          sed -i "s/version = \"$VERSION\"/version = \"$NEXT\"/" build.gradle.kts
          grep 'version = ' build.gradle.kts
          git add build.gradle.kts
          git commit -m "Set next development version $NEXT"
          git push origin HEAD
